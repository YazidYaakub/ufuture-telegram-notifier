name: Publish image and setup files

# Runs when a GitHub release is published (e.g. v1.7.0), or manually.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the setup zip to the release
  packages: write   # push the image to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up QEMU (to build for ARM, e.g. Raspberry Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attach setup files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp docker-compose.yml .env.example dist/
          cp docs/setup-guide.md dist/setup-guide.md
          (cd dist && zip -q ../ufuture-setup.zip docker-compose.yml .env.example setup-guide.md)
          gh release upload "${{ github.event.release.tag_name }}" ufuture-setup.zip --clobber
